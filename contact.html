  <section class="contact">
    <div class="contact-container">
      <h1>Get in Touch</h1>
      <p>For collaborations or just to say hello, feel free to reach out below.</p>

      <div class="contact-box">
        <form action="https://formspree.io/f/xjkrzern" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" placeholder="Your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>
          </div>

          <button type="submit" class="btn secondary2">Send Message</button>
        </form>
      </div>
    </div>
  </section>

 <script>


const toggleButton = document.getElementById('mode-toggle');
const body = document.body;

// Load saved theme
if (localStorage.getItem('theme') === 'dark') {
  body.classList.add('dark-mode');
}

toggleButton.addEventListener('click', () => {
  body.classList.toggle('dark-mode');

  const isDark = body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});








  </script>
